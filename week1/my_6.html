<!DOCTYPE html>
<html>
  <head>
    <title>Hello world</title>
  </head>

  <body>
    <h1>เลือกสี</h1>
    <select id="color-select">
      <option value="red">แดง</option>
      <option value="green">เขียว</option>
    </select>
    <h1 id="show-color">-</h1>
    <script>
      document
        .getElementById("color-select")
        .addEventListener("change", function () {
          const value = this.value;
          document.getElementById("show-color").innerText =
            "สีที่เลือก : " + value;
          document.getElementById("shoe-color").style.color = value;
        });
    </script>
  </body>
</html>
